name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: gofmt -l . | tee /tmp/fmt.out && [ ! -s /tmp/fmt.out ]
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -race
      - name: Verify generated code is reproducible and committed
        run: |
          cp gen/go/types.go /tmp/types.before
          go generate ./...
          diff /tmp/types.before gen/go/types.go
